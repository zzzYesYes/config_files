set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g set-clipboard on
set-option -g renumber-windows on

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bg="#24273a"
fg="#cad3f5"
surface="#494d64"
mauve="#c6a0f6"
crust="#181926"

set -g status-justify "left"
set -g status-bg "${bg}"
set -g status-fg "${fg}"
set -g status-left ""
set -g window-status-activity-style "fg=${fg},bg=${bg},none"
set -g window-status-style "fg=${fg},bg=${bg},none"
set -g window-status-separator " "
set -g window-status-current-format "#[bg=${mauve},fg=${crust}]#I:*#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev)"
set -g window-status-format "#[fg=${fg}]#I:#W"
set -g status-right "#S | #W | %Y-%m-%d %H:%M "
