[flavor]
dark = "catppuccin-mocha"
light = "catppuccin-mocha"

# Mauve accent overrides to match rofi/waybar/wlogout

[mgr]
cwd = { fg = "#cba6f7" }
border_style = { fg = "#cba6f7" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
normal_alt  = { fg = "#cba6f7", bg = "#313244" }

[tabs]
active   = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
inactive = { fg = "#cba6f7", bg = "#313244" }

[pick]
border = { fg = "#cba6f7" }

[input]
border = { fg = "#cba6f7" }

[cmp]
border = { fg = "#cba6f7" }

[tasks]
border = { fg = "#cba6f7" }

[spot]
border = { fg = "#cba6f7" }
title  = { fg = "#cba6f7" }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#94e2d5" },
	{ mime = "**/{audio,video}/*", fg = "#f9e2af" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#a6e3a1" },
	{ mime = "vfs/{absent,stale}", fg = "#9399b2" },
	{ url = "*", fg = "#cdd6f4" },
	{ url = "*/", fg = "#cba6f7" },
]
