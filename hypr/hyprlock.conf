# Catppuccin Mocha lock screen — matches waybar/rofi/wlogout

general {
    grace = 0
    no_fade_in = false
    hide_cursor = true
}

background {
    monitor =
    path = /home/zzz/Pic/firewatch02.png
    blur_passes = 2
    blur_size = 5
    noise = 0.02
    brightness = 0.7
}

input-field {
    monitor =
    size = 400, 60
    rounding = 0
    outline_thickness = 2
    outer_color = rgb(cba6f7)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    font_family = BigBlueTermPlus Nerd Font Propo
    dots_size = 0.3
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##7f849c">password...</span>
    check_color = rgb(f9e2af)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(f9e2af)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = BigBlueTermPlus Nerd Font Propo
    font_size = 64
    color = rgb(cdd6f4)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = BigBlueTermPlus Nerd Font Propo
    font_size = 20
    color = rgb(cba6f7)
    position = 0, 60
    halign = center
    valign = center
}
